spring.application.name=Backend

# Render injeta PORT; local usa 8080
server.port=${PORT:8080}

# URL do front (sem barra no final) — link no e-mail de convite: {base}/convite/{token}
servify.gmail.frontend-base-url=${FRONTEND_BASE_URL:https://plf-es-2026-1-ti2-1381100-grupo3-servify.onrender.com}
spring.output.ansi.enabled=always

#spring.flyway.repair-on-migrate=true
spring.flyway.enabled=true
# Permite aplicar migração "atrasada" (ex.: V7 adicionada depois que V8 já rodou no banco local).
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate

# Banco: local por padrão; Render usa DATABASE_URL (convertido automaticamente) ou SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servify}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
api.security.token.secret=${JWT_SECRET:my-secret-key}

# CORS extra (produção): padrões separados por vírgula
servify.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://plf-es-2026-1-ti2-1381100-grupo3-servify.onrender.com}

# Gmail API (OAuth2). Com enabled=true, ao criar convite envia e-mail com token + senha provisória (padrão 12345; hash em convite e em usuário pré-cadastro).
servify.gmail.enabled=${SERVIFY_GMAIL_ENABLED:false}
servify.gmail.sender-email=${SERVIFY_GMAIL_SENDER_EMAIL:}
servify.gmail.credentials-path=${SERVIFY_GMAIL_CREDENTIALS_PATH:credentials.json}
servify.gmail.tokens-directory=${SERVIFY_GMAIL_TOKENS_DIRECTORY:tokens}
servify.gmail.application-name=Servify Backend
# Login Google no navegador: mesma URL registrada no Google Cloud (cliente OAuth tipo Web) e rota /oauth/google/callback no Vite.
servify.gmail.oauth-redirect-uri=${SERVIFY_GMAIL_OAUTH_REDIRECT_URI:}
