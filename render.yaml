# Blueprint Render — front (Docker/nginx) + API Spring Boot (Docker) + banco Neon (externo)
services:
  - type: web
    name: servify-front
    runtime: docker
    rootDir: src/front/servify
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        value: https://backend-shbt.onrender.com
      - key: VITE_APP_BASE_URL
        value: https://plf-es-2026-1-ti2-1381100-grupo3-servify.onrender.com

  - type: web
    name: servify-api
    runtime: docker
    rootDir: src/back
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    envVars:
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://plf-es-2026-1-ti2-1381100-grupo3-servify.onrender.com
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://plf-es-2026-1-ti2-1381100-grupo3-servify.onrender.com
      - key: SERVIFY_GMAIL_OAUTH_REDIRECT_URI
        value: https://plf-es-2026-1-ti2-1381100-grupo3-servify.onrender.com/oauth/google/callback
      - key: SERVIFY_GMAIL_ENABLED
        value: "false"
